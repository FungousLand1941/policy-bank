name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - name: Reproduce the headline numbers from data/
        run: |
          python -m policybank score --boot 2000
          python -m policybank route --images
          python -m policybank select

  paper-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Regenerate summary, site data and LaTeX numbers; fail if they drift from the commit
        run: |
          python tools/export_site_data.py
          python tools/make_tables.py
          git diff --exit-code -- paper/generated site/data results/summary.json
