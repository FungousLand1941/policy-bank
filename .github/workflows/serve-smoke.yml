name: serve-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: server from source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[serve]"
      - name: Smoke test, then the server must stop nonzero on its own
        timeout-minutes: 3
        run: |
          python -m policybank serve --host 127.0.0.1 --port 8000 --replay 32 --chunk 4 > server.log 2>&1 &
          pid=$!
          status=0
          python docker/smoke_test.py --uri ws://127.0.0.1:8000 --http http://127.0.0.1:8000 || status=$?
          if [ "$status" -ne 0 ]; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit "$status"
          fi
          for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::server still running 30 s after the invalid frame"
            kill "$pid"
            exit 1
          fi
          code=0
          wait "$pid" || code=$?
          echo "server exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "::error::server exited 0 after a terminal failure"
            exit 1
          fi
          grep -q "terminal failure: contract" server.log || { echo "::error::no contract failure in the log"; exit 1; }
      - name: Server log
        if: always()
        run: cat server.log || true

  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: policybank-serve:ci
      NAME: policybank-serve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the serving image
        timeout-minutes: 10
        run: docker build -f docker/Dockerfile.serve -t "$IMAGE" .
      - name: Install the smoke-test client
        run: pip install numpy msgpack websockets .
      - name: Start the container (detached, no restart policy)
        run: docker run -d --name "$NAME" --restart no -p 8000:8000 "$IMAGE"
      - name: Wait for the container health check
        timeout-minutes: 2
        run: |
          for _ in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$NAME")
            echo "container: $state"
            case "$state" in
              "running healthy") exit 0 ;;
              running*) sleep 2 ;;
              *) echo "::error::container is $state before becoming healthy"; exit 1 ;;
            esac
          done
          echo "::error::container not healthy after 90 s"
          exit 1
      - name: Image runs as uid 65532 under tini
        run: |
          uid=$(docker exec "$NAME" python -c "import os; print(os.stat('/proc/1').st_uid)")
          echo "pid 1 uid: $uid"
          test "$uid" = 65532 || { echo "::error::PID 1 runs as uid $uid, expected 65532"; exit 1; }
          pid1=$(docker exec "$NAME" cat /proc/1/cmdline | tr '\0' ' ')
          echo "pid 1: $pid1"
          case "$pid1" in
            *tini\ --\ python\ -m\ policybank\ serve*) ;;
            *) echo "::error::PID 1 is not tini running the server"; exit 1 ;;
          esac
      - name: Smoke test against the container
        timeout-minutes: 3
        run: python docker/smoke_test.py --uri ws://127.0.0.1:8000 --http http://127.0.0.1:8000
      - name: Container must stop with a nonzero exit code
        timeout-minutes: 1
        run: |
          code=$(timeout 30 docker wait "$NAME") || { echo "::error::container still running 30 s after the invalid frame"; exit 1; }
          echo "container exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "::error::container exited 0 after a terminal failure"
            exit 1
          fi
          restarts=$(docker inspect -f '{{.RestartCount}}' "$NAME")
          test "$restarts" -eq 0 || { echo "::error::container restarted $restarts times"; exit 1; }
          docker logs "$NAME" 2>&1 | grep -q "terminal failure: contract" || { echo "::error::no contract failure in the log"; exit 1; }
      - name: Container logs
        if: failure()
        run: |
          docker logs "$NAME" || true
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "$NAME" || true
      - name: Remove the container
        if: always()
        run: docker rm -f "$NAME" || true
