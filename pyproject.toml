[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policybank"
version = "1.0.0"
description = "Development-selected routing of public robot policies for the BEHAVIOR-1K challenge"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Keshav Balakrishna" },
  { name = "Abhijay Gangerapu" },
  { name = "Rithik Satarla" },
]
dependencies = ["numpy>=1.24", "msgpack>=1.0"]

[project.optional-dependencies]
serve = ["websockets>=13"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7", "websockets>=13", "ruff>=0.6"]

[project.scripts]
policybank = "policybank.cli:main"

[tool.setuptools.packages.find]
include = ["policybank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402", "E501"]
